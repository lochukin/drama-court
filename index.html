<style>
:root{

}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#C05C36;
  font-family:"Noto Sans SC",-apple-system,"PingFang SC",sans-serif;
  -webkit-font-smoothing:antialiased}
#board{position:absolute;left:50%;top:50%;width:1600px;height:1000px;transform-origin:50% 50%}
#actors{position:absolute;inset:0}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;
  --court:#C05C36;--line:#F3EDE2;--net:#E9E3D6;background:var(--court)}
body[data-s="hard"]  #stage{--court:#2F6BA6}
body[data-s="grass"] #stage{--court:#4F8A46;--line:#FAF7EF}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(125% 88% at 50% 44%,rgba(60,20,8,0) 38%,rgba(60,20,8,.20) 100%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(120,45,20,.20) 1px,transparent 1px),
                   radial-gradient(rgba(255,220,190,.13) 1px,transparent 1px);
  background-size:7px 7px,11px 11px;background-position:0 0,3px 5px}
svg.court{position:absolute;inset:0;width:100%;height:100%}
.floor{fill:var(--court)}
.lines{stroke:var(--line);stroke-width:7;fill:none;stroke-linecap:square}

/* ---------- 顶部 ---------- */
.top{position:absolute;left:0;right:0;top:0;z-index:50;display:flex;flex-direction:column;
  align-items:center;padding:26px 0 0;pointer-events:none}
.brand{text-align:center;color:#F7F4EE;text-shadow:0 2px 14px rgba(70,24,8,.35)}
.brand h1{margin:0;font:600 17px/1 var(--mono);letter-spacing:.42em;text-indent:.42em}
.brand p{margin:9px 0 0;font:11px/1 var(--mono);letter-spacing:.26em;opacity:.75;text-indent:.26em}
.tabs{pointer-events:auto;display:flex;gap:4px;margin-top:16px;padding:5px;border-radius:999px;
  background:rgba(247,244,238,.16);border:1px solid rgba(247,244,238,.34);backdrop-filter:blur(14px)}
.tabs button{border:0;cursor:pointer;padding:9px 22px;border-radius:999px;background:transparent;
  color:#F7F4EE;font:12px/1 var(--mono);letter-spacing:.16em;opacity:.78;transition:.15s}
.tabs button:hover{opacity:1}
.tabs button.on{background:#F7F4EE;color:var(--ink);opacity:1;font-weight:700}

/* ---------- 人物 ---------- */
.actor{position:absolute;transform:translate(-50%,-100%) scaleX(var(--flip,1));
  transform-origin:50% 100%;z-index:5;touch-action:none}
.actor img{display:block;height:var(--h);width:auto;pointer-events:none;
  filter:drop-shadow(-4px 3px 0 rgba(40,14,6,.10)) drop-shadow(3px 6px 9px rgba(40,14,6,.30))}
.actor .sh{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
  width:calc(var(--h)*.44*var(--sw,1));height:calc(var(--h)*.10);border-radius:50%;
  background:radial-gradient(ellipse at 42% 50%,rgba(46,16,6,.38),rgba(46,16,6,.13) 55%,transparent 74%)}
.actor:hover{z-index:40}
.actor.hot img{filter:drop-shadow(-4px 3px 0 rgba(40,14,6,.10)) drop-shadow(3px 6px 9px rgba(40,14,6,.30))
  drop-shadow(0 0 10px rgba(216,243,58,.85))}

/* 编辑模式 */
.actor::before{content:"";position:absolute;left:50%;bottom:-3px;
  width:calc(var(--head) * 1.45);height:calc(var(--head) * 0.40);transform:translateX(-50%);
  border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(58,22,10,.46),rgba(58,22,10,.18) 55%,rgba(58,22,10,0) 74%)}
@keyframes figIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.actor img{animation:figIn .55s cubic-bezier(.2,.8,.25,1) backwards;
  transition:transform .22s cubic-bezier(.2,.8,.25,1),filter .22s}
.actor:hover img{transform:translateY(-5px) scale(1.035)}
body.editing .actor{cursor:grab;outline:0}
body.editing .actor:hover img{transform:none}
body.editing .actor::after{content:"";position:absolute;inset:-6px;border:1.5px dashed rgba(247,244,238,.75);
  border-radius:8px;pointer-events:none}
body.editing .actor.drag{cursor:grabbing;z-index:90}
body.editing .actor.drag::after{border-color:var(--accent);border-style:solid}

/* ---------- 卡片 ---------- */
.card{position:absolute;z-index:70;width:316px;padding:18px 20px 16px;
  background:rgba(247,244,238,.96);border:1px solid rgba(20,20,20,.16);border-radius:14px;
  box-shadow:0 24px 60px rgba(40,14,6,.28);backdrop-filter:blur(18px);
  opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .15s,transform .15s}
.card.on{opacity:1;transform:translateY(0);pointer-events:auto}
.card .no{font:10px/1.6 var(--mono);letter-spacing:.24em;color:#8C8478}
.card h3{margin:10px 0 7px;font:600 19px/1.45 "Songti SC",Georgia,serif;letter-spacing:.01em}
.card .meta{font:11px/1.6 var(--mono);color:#6B6B6B;margin-bottom:10px;
  padding-bottom:9px;border-bottom:1px solid rgba(20,20,20,.10)}
.card p{margin:0;font-size:12.5px;line-height:1.8;color:#2A2A2A}
.card .more{display:inline-block;margin-top:14px;font-size:13px;text-decoration:none;
  border-bottom:1px solid currentColor;opacity:.8}
.card .more:hover{opacity:1}
.card .tag{display:inline-block;margin-top:12px;font:10.5px/1 var(--mono);letter-spacing:.08em;
  padding:6px 10px;background:var(--accent);color:var(--ink);border-radius:999px}

/* ---------- 工具条 ---------- */
.bar{position:fixed;right:18px;bottom:16px;z-index:80;display:flex;gap:8px;align-items:center}
.bar button{border:1px solid rgba(247,244,238,.4);cursor:pointer;padding:9px 15px;border-radius:999px;
  background:rgba(20,20,20,.55);color:#F7F4EE;font:11.5px/1 var(--mono);letter-spacing:.1em;
  backdrop-filter:blur(10px);transition:.15s}
.bar button:hover{background:rgba(20,20,20,.75)}
.bar button.on{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
.edit-cta{position:absolute;right:26px;top:26px;padding:7px 13px;border-radius:999px;
  border:1px solid rgba(20,20,20,.22);background:rgba(247,244,238,.55);color:#4A4A4A;
  font:500 11.5px/1 -apple-system,"PingFang SC";cursor:pointer;backdrop-filter:blur(8px);
  pointer-events:auto;opacity:.62;transition:.2s}
.edit-cta:hover{opacity:1}
.edit-cta.on{background:var(--accent);border-color:#141414}
#inspector{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;
  align-items:center;gap:12px;padding:10px 16px;border-radius:14px;z-index:60;
  background:rgba(24,17,12,.78);color:#F7F4EE;backdrop-filter:blur(12px);
  font:12px/1 -apple-system,"PingFang SC";box-shadow:0 8px 28px rgba(0,0,0,.28)}
body.editing #inspector.on{display:flex}
#inspector b{font-weight:600;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#inspector label{display:flex;align-items:center;gap:5px;opacity:.9}
#inspector input[type=number]{width:58px;padding:4px 6px;border-radius:6px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);color:#fff;font:12px/1 ui-monospace,Menlo,monospace}
#inspector input[type=range]{width:110px;accent-color:#D8F33A}
#inspector i{font-style:normal;width:22px;text-align:right;opacity:.75;font-family:ui-monospace,Menlo,monospace}
#inspector button{padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:12px}
body.editing .actor.sel{outline:2px solid #D8F33A;outline-offset:2px}
.hint{position:fixed;left:18px;bottom:16px;z-index:80;font:11px/1.7 var(--mono);color:rgba(247,244,238,.72);
  background:rgba(20,20,20,.42);padding:9px 14px;border-radius:10px;backdrop-filter:blur(10px);
  pointer-events:none;opacity:0;transition:.2s}
body.editing .edit-cta{position:absolute;right:26px;top:26px;padding:7px 13px;border-radius:999px;
  border:1px solid rgba(20,20,20,.22);background:rgba(247,244,238,.55);color:#4A4A4A;
  font:500 11.5px/1 -apple-system,"PingFang SC";cursor:pointer;backdrop-filter:blur(8px);

#inspector input[type=range]{width:110px;accent-color:#D8F33A}
#inspector i{font-style:normal;width:22px;text-align:right;opacity:.75;font-family:ui-monospace,Menlo,monospace}

  background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:12px}
body.editing .actor.sel{outline:2px solid #D8F33A;outline-offset:2px}
body.editing .hint{opacity:1}
.empty-note{position:absolute;inset:0;display:none;place-items:center;z-index:20;pointer-events:none}
body.empty .empty-note{display:grid}
.empty-note span{font:12.5px/1 var(--mono);letter-spacing:.18em;color:#141414;
  background:rgba(247,244,238,.9);border:1px dashed rgba(20,20,20,.4);
  padding:14px 22px;border-radius:10px}

const stage=document.getElementById('stage'), card=document.getElementById('card');
const board=document.getElementById('board'), actorsLayer=document.getElementById('actors');
let SCALE=1;
function fit(){ SCALE=Math.min(innerWidth/1600, innerHeight/1000);
  board.style.transform=`translate(-50%,-50%) scale(${SCALE})`; }
addEventListener('resize',fit);
let hideTimer=null;
const cancelHide=()=>{ if(hideTimer){ clearTimeout(hideTimer); hideTimer=null; } };
const scheduleHide=()=>{ cancelHide(); hideTimer=setTimeout(()=>{ card.classList.remove('on'); }, 260); };
const PAGES=new Set([1,2,3,4,5,6,7,9,11,12,13,14,16,17]);
const KEY='dc-pos-v1';
const saved=JSON.parse(localStorage.getItem(KEY)||'{}');
let editing=false, surface='clay', sel=null;
const insp=document.getElementById('inspector');

EVENTS.forEach(e=>{
  if(saved[e.id]){ e.x=saved[e.id].x; e.y=saved[e.id].y; e.head=saved[e.id].head; }
});

function render(){
  actorsLayer.querySelectorAll('.actor').forEach(n=>n.remove());
  EVENTS.forEach(e=>{
    const el=document.createElement('div');
    el.className='actor'; el.dataset.id=e.id; el.dataset.s=e.s;
    el.style.cssText=`left:${e.x}px;top:${e.y}px;--head:${e.head}px;--r:${e.r};--flip:${e.f};--sw:${e.sw||1}`;
    el.innerHTML=`<div class="sh"></div><img src="assets/${e.img}.webp" alt="">`;
    const im=el.querySelector('img');
    im.style.height=`calc(var(--head) * var(--r))`;
    im.style.animationDelay=(EVENTS.indexOf(e)*38)+'ms';
    bind(el,e); actorsLayer.appendChild(el);
  });
  applySurface();
}

function applySurface(){
  let n=0;
  actorsLayer.querySelectorAll('.actor').forEach(el=>{
    const ok=el.dataset.s===surface; el.style.display=ok?'':'none'; if(ok)n++;
  });
  document.body.classList.toggle('empty', n===0);
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.s===surface));
  document.body.dataset.s=surface;
  if(typeof fit==='function') fit();
}

function bind(el,e){
  let drag=false,sx=0,sy=0,ox=0,oy=0,moved=false;
  el.addEventListener('pointerdown',ev=>{
    if(!editing) return;
    select(el,e);
    ev.preventDefault(); el.setPointerCapture(ev.pointerId); el.classList.add('drag');
    drag=true; moved=false; sx=ev.clientX; sy=ev.clientY;
    ox=parseFloat(el.style.left); oy=parseFloat(el.style.top);
  });
  el.addEventListener('pointermove',ev=>{
    if(!drag) return;
    if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>3) moved=true;
    e.x=ox+(ev.clientX-sx)/SCALE; e.y=oy+(ev.clientY-sy)/SCALE;
    el.style.left=e.x+'px'; el.style.top=e.y+'px';
  });
  el.addEventListener('pointerup',ev=>{
    if(!drag) return; drag=false; el.classList.remove('drag'); el.releasePointerCapture(ev.pointerId);
    persist();
  });
  el.addEventListener('wheel',ev=>{
    if(!editing) return;
    ev.preventDefault();
    e.head=Math.max(14,Math.min(70, e.head*(ev.deltaY>0?0.94:1.06)));
    el.style.setProperty('--head', e.head+'px');
    el.querySelector('img').style.height='calc(var(--head) * var(--r))';
    persist();
  },{passive:false});
  el.addEventListener('dblclick',()=>{
    if(!editing) return;
    const d=EVENTS.find(x=>x.id===e.id);
    e.head=DEF[e.id].head; e.x=DEF[e.id].x; e.y=DEF[e.id].y;
    el.style.left=e.x+'px'; el.style.top=e.y+'px'; el.style.setProperty('--head',e.head+'px');
    el.querySelector('img').style.height='calc(var(--head) * var(--r))';
    persist();
  });
  el.addEventListener('mouseenter',()=>{
    if(editing){ el.classList.add('hot'); return; }
    cancelHide();
    el.classList.add('hot');
    card.innerHTML=`<div class="no">CASE #${String(e.id).padStart(3,'0')}</div><h3>${e.t}</h3>
      <div class="meta">${e.m}</div><p>${e.p}</p><span class="tag">${e.tag}</span>
      ${PAGES.has(e.id)?`<a class="more" href="cases/${e.id}.html">查看完整条目 →</a>`:''}`;
    const r=el.getBoundingClientRect();
    let x=r.left+r.width/2+80, y=r.top-40;
    if(x+340>innerWidth) x=r.left-340;
    if(y<130) y=130;
    if(y+290>innerHeight) y=innerHeight-290;
    card.style.left=x+'px'; card.style.top=y+'px'; card.classList.add('on');
  });
  el.addEventListener('mouseleave',()=>{ el.classList.remove('hot'); scheduleHide(); });
}

function apply(el,e){
  el.style.left=e.x+'px'; el.style.top=e.y+'px';
  el.style.setProperty('--head',e.head+'px');
  el.querySelector('img').style.height='calc(var(--head) * var(--r))';
  document.getElementById('inX').value=Math.round(e.x);
  document.getElementById('inY').value=Math.round(e.y);
  document.getElementById('inHead').value=Math.round(e.head);
  document.getElementById('inHeadV').textContent=Math.round(e.head);
}
function select(el,e){
  stage.querySelectorAll('.actor.sel').forEach(n=>n.classList.remove('sel'));
  el.classList.add('sel'); sel={el,e};
  document.getElementById('inspName').textContent=`#${String(e.id).padStart(3,'0')} ${e.img}`;
  apply(el,e); insp.classList.add('on');
}
['inX','inY'].forEach(id=>document.getElementById(id).addEventListener('input',ev=>{
  if(!sel) return; const v=parseFloat(ev.target.value)||0;
  if(id==='inX') sel.e.x=v; else sel.e.y=v;
  apply(sel.el,sel.e); persist();
}));
document.getElementById('inHead').addEventListener('input',ev=>{
  if(!sel) return; sel.e.head=+ev.target.value; apply(sel.el,sel.e); persist();
});
document.getElementById('inReset').addEventListener('click',()=>{
  if(!sel) return; const d=DEF[sel.e.id];
  sel.e.x=d.x; sel.e.y=d.y; sel.e.head=d.head; apply(sel.el,sel.e); persist();
});
addEventListener('keydown',ev=>{
  if(!editing||!sel) return;
  const st=ev.shiftKey?10:1;
  const m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[ev.key];
  if(m){ ev.preventDefault(); sel.e.x+=m[0]; sel.e.y+=m[1]; apply(sel.el,sel.e); persist(); return; }
  if(ev.key==='+'||ev.key==='='){ sel.e.head=Math.min(70,sel.e.head+1); apply(sel.el,sel.e); persist(); }
  if(ev.key==='-'){ sel.e.head=Math.max(14,sel.e.head-1); apply(sel.el,sel.e); persist(); }
  if(ev.key==='Escape'){ sel.el.classList.remove('sel'); sel=null; insp.classList.remove('on'); }
});
stage.addEventListener('pointerdown',ev=>{
  if(ev.target===stage||ev.target===board||ev.target.tagName==='svg'){ stage.querySelectorAll('.actor.sel').forEach(n=>n.classList.remove('sel')); sel=null; insp.classList.remove('on'); }
});

const DEF={};
EVENTS.forEach(e=>DEF[e.id]={x:e.x,y:e.y,head:e.head});

function persist(){
  const o={};
  EVENTS.forEach(e=>{ o[e.id]={x:Math.round(e.x),y:Math.round(e.y),head:Math.round(e.head)}; });
  localStorage.setItem(KEY, JSON.stringify(o));
}

document.getElementById('tabs').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  surface=b.dataset.s; applySurface();
});

const editBtn=document.getElementById('edit'), expoBtn=document.getElementById('expo');
editBtn.addEventListener('click',()=>{
  editing=!editing;
  document.body.classList.toggle('editing',editing);
  editBtn.classList.toggle('on',editing);
  editBtn.textContent=editing?'完成':'调整';
  if(!editing){ sel=null; insp.classList.remove('on'); stage.querySelectorAll('.actor.sel').forEach(n=>n.classList.remove('sel')); }
  expoBtn.hidden=!editing; document.getElementById('reset').hidden=!editing;
  card.classList.remove('on');
});
document.getElementById('reset').addEventListener('click',()=>{
  if(!confirm('把所有人物恢复到默认位置和大小？')) return;
  EVENTS.forEach(e=>{ e.x=DEF[e.id].x; e.y=DEF[e.id].y; e.head=DEF[e.id].head; });
  localStorage.removeItem(KEY); sel=null; insp.classList.remove('on'); render();
});
expoBtn.addEventListener('click',()=>{
  const o={};
  EVENTS.forEach(e=>{ o[e.id]={x:Math.round(e.x),y:Math.round(e.y),head:Math.round(e.head),f:e.f}; });
  const txt=JSON.stringify(o,null,0);
  navigator.clipboard && navigator.clipboard.writeText(txt);
  alert('坐标已复制到剪贴板：\n\n'+txt);
});

fit();
card.addEventListener('mouseenter',cancelHide);
card.addEventListener('mouseleave',scheduleHide);
render();
requestAnimationFrame(()=>fit());
if(location.search.includes('edit')) document.getElementById('edit').click();
{
  const g=new URLSearchParams(location.search).get('go');
  if(g){ surface=g; applySurface(); }
}
if(location.search.includes('open')){
  setTimeout(()=>{ const a=actorsLayer.querySelector('.actor[data-id="2"]');
    if(a) a.dispatchEvent(new Event('mouseenter')); },200);
}
if(location.search.includes('sel')){
  setTimeout(()=>{ const a=actorsLayer.querySelector('.actor[data-s="clay"]');
    if(a) a.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true})); },120);
}
</script></body></html>
